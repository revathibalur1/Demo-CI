name: Simple CI with Artifacts

on: [push]

jobs:
  echo-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create messages file
        run: |
          echo "Hello from GitHub Actions CI/CD" > messages.txt
          echo "This is the second message from CI/CD..." >> messages.txt

      - name: Upload messages as artifact
        uses: actions/upload-artifact@v3
        with:
          name: ci-messages
          path: messages.txt
